[project]
name = "gemma4-delimiter-proxy"
version = "0.1.0"
description = "FastAPI SSE proxy that transpiles Gemma 4 channel/tool-call delimiters into OpenAI chat-completion format"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
]

[project.scripts]
gemma4-delimiter-proxy = "gemma4_delimiter_proxy.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma4_delimiter_proxy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
